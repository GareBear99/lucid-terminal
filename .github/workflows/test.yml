name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: node-pty's native build has no Linux prebuild
      # and fails in CI (same reason local installs use it). Neither the
      # vitest suite nor the tool-integration script needs node-pty or
      # the Electron binary.
      # `npm ci`: package-lock.json is tracked, so installs are
      # reproducible from the lockfile.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests (vitest)
        run: npm test

      - name: Run tool integration tests
        run: npm run test:tools

      - name: Typecheck
        run: npm run typecheck
